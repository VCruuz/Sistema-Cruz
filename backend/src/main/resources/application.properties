# --- CONFIGURAÇÃO DA APLICAÇÃO ---
spring.application.name=sistema-cruz

# --- BANCO DE DADOS MYSQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_cruz_engenharia?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# --- SERIALIZAÇÃO: evita loop infinito em relacionamentos bidirecionais ---
spring.jackson.serialization.fail-on-empty-beans=false

# --- SERVIDOR ---
server.port=8080

# --- SEED INICIAL ---
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
